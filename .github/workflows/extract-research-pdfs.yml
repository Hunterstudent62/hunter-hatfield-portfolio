name: Extract research PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-research-pdfs.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PDF reader
        run: python -m pip install pypdf
      - name: Extract research PDFs
        run: python tools/extract_research_pdfs.py
      - name: Commit extracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/research_extracts
          git diff --cached --quiet && exit 0
          git commit -m "Extract research PDF text for portfolio update"
          git push
