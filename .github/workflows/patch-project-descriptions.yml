name: Patch project descriptions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-project-descriptions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply description patch
        run: python3 tools/patch_project_descriptions.py
      - name: Commit changes
        run: |
          git config user.name "Hunter Hatfield"
          git config user.email "hunterhatfield@usf.edu"
          git add index.html
          git commit -m "Rewrite coursework project descriptions"
          git push
