name: Reorder portfolio sections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-portfolio-sections.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder portfolio sections
        run: python3 tools/reorder_portfolio_sections.py
      - name: Commit changes
        run: |
          git config user.name "Hunter Hatfield"
          git config user.email "hunterhatfield@usf.edu"
          git add index.html
          git commit -m "Reorder portfolio around featured work and experience"
          git push
