name: Add Kid Hop-o experience link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-hopo-experience-link.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Kid Hop-o link patch
        run: python3 tools/patch_hopo_experience_link.py
      - name: Commit changes
        run: |
          git config user.name "Hunter Hatfield"
          git config user.email "hunterhatfield@usf.edu"
          git add index.html style.css
          git commit -m "Add Kid Hop-o website link to experience"
          git push
