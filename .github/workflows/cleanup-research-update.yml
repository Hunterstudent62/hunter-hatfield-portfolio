name: Cleanup research portfolio update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-research-update.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Remove temporary update files
        run: |
          rm -f tools/extract_research_pdfs.py
          rm -f tools/add_research_writing_section.py
          rm -rf tools/research_extracts
          rm -f .github/workflows/extract-research-pdfs.yml
          rm -f .github/workflows/add-research-writing-section.yml
          rm -f .github/workflows/cleanup-research-update.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary research portfolio helpers"
          git push
