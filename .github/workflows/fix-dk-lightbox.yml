name: Fix DK lightbox scaling

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dk-lightbox.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lightbox scaling fix
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          old = '''      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightboxImage.style.background = image.src.includes("dk-sprite-sheet.png") ? "#1c1c1a" : "transparent";
      lightboxCaption.textContent = image.alt;'''
          new = '''      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      const isDkSpriteSheet = image.src.includes("dk-sprite-sheet.png");
      const isDkPortraitSheet = image.src.includes("dk-expressions.png");
      lightboxImage.style.background = isDkSpriteSheet ? "#1c1c1a" : "transparent";
      lightboxImage.classList.toggle("large-preview", isDkSpriteSheet || isDkPortraitSheet);
      lightboxImage.classList.toggle("pixel-preview", isDkSpriteSheet);
      lightboxCaption.textContent = image.alt;'''
          if old not in html:
              raise SystemExit("Expected lightbox block not found")
          html = html.replace(old, new)
          index.write_text(html, encoding="utf-8")

          css = Path("style.css")
          styles = css.read_text(encoding="utf-8")
          styles = styles.replace(
              '''.lightbox-content {
  max-width: min(1200px, 94vw);
  max-height: 90vh;''',
              '''.lightbox-content {
  max-width: 96vw;
  max-height: 94vh;'''
          )
          marker = '''.lightbox-caption {
  margin: 0;'''
          addition = '''.lightbox-image.large-preview {
  width: min(1500px, 94vw);
  max-width: 94vw;
  max-height: 88vh;
}
.lightbox-image.pixel-preview {
  image-rendering: pixelated;
}

.lightbox-caption {
  margin: 0;'''
          if marker not in styles:
              raise SystemExit("Expected lightbox caption marker not found")
          styles = styles.replace(marker, addition)
          css.write_text(styles, encoding="utf-8")
      - name: Commit changes
        run: |
          git config user.name "Hunter Hatfield"
          git config user.email "hunterhatfield@usf.edu"
          git add index.html style.css
          git commit -m "Enlarge DK lightbox previews"
          git push
