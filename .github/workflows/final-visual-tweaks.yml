name: Final visual tweaks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-visual-tweaks.yml

permissions:
  contents: write

jobs:
  tweak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested portfolio tweaks
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace(
              '<div><div class="tag-row"><span class="tag">3D Model</span><span class="tag">Kid Hop-o</span></div><h3>Flyer Spaceship Model</h3><p>A stylized 3D spaceship asset created for Kid Hop-o as part of my earlier 3D game-production work.</p></div>',
              '<div><div class="tag-row"><span class="tag">3D Model</span><span class="tag">Unity</span></div><h3>Flyer Spaceship Model</h3><p>A voxel-style 3D spaceship asset created for Kid Hop-o in Unity, demonstrating stylized game-asset modeling and source-asset preparation.</p></div>'
          )
          html = html.replace(
              '      lightboxImage.alt = image.alt;\n      lightboxCaption.textContent = image.alt;',
              '      lightboxImage.alt = image.alt;\n      lightboxImage.style.background = image.src.includes("dk-sprite-sheet.png") ? "#1c1c1a" : "transparent";\n      lightboxCaption.textContent = image.alt;'
          )
          index.write_text(html, encoding="utf-8")

          css = Path("style.css")
          styles = css.read_text(encoding="utf-8")
          styles = styles.replace('  background: var(--surface);\n  border: 1px solid rgba(255, 255, 255, .24);', '  background: transparent;\n  border: 1px solid rgba(255, 255, 255, .24);')
          css.write_text(styles, encoding="utf-8")
      - name: Commit changes
        run: |
          git config user.name "Hunter Hatfield"
          git config user.email "hunterhatfield@usf.edu"
          git add index.html style.css
          git commit -m "Refine Flyer labeling and lightbox backgrounds"
          git push
