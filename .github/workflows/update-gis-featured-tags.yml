name: Update GIS featured tags

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-gis-featured-tags.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Update GIS tags
        run: python tools/update_gis_featured_tags.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update GIS featured project tags"
          git push
