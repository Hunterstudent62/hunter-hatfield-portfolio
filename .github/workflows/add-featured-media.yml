name: Add featured project media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-featured-media.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Update featured project cards
        run: python tools/add_featured_media.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git diff --cached --quiet && exit 0
          git commit -m "Add GIS maps and Kid Hop-o trailer to featured projects"
          git push
