name: Extract evaluation text

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/extract-eval-text.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF/OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Extract evaluation text
        run: python3 tools/extract_eval_text.py
      - name: Commit extracted text
        run: |
          git config user.name "Hunter Hatfield"
          git config user.email "hunterhatfield@usf.edu"
          git add tools/eval_extracted.txt
          git commit -m "Temporarily extract ZooTampa evaluation text"
          git push
