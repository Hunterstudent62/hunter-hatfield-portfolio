name: Add ZooTampa evaluation link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-zootampa-evaluation-link.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ZooTampa evaluation link patch
        run: python3 tools/patch_zootampa_evaluation_link.py
      - name: Commit changes
        run: |
          git config user.name "Hunter Hatfield"
          git config user.email "hunterhatfield@usf.edu"
          git add index.html style.css
          git commit -m "Add ZooTampa internship evaluation link"
          git push
